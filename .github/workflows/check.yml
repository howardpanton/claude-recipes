name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook tests, frontmatter, links, scrub
        run: sh tools/check.sh
        env:
          # Optional repository secret; the scrub check is skipped without it.
          SCRUB_PATTERN: ${{ secrets.SCRUB_PATTERN }}
